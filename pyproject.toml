[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probability"
version = "0.0.160"
description = "Probability in Python 3"
readme = "README.MD"
license = { file = "license.txt" }
authors = [
    { name = "Vahndi Minah" }
]
keywords = ["python", "probability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.9"
dependencies = [
    "compound-types",
    "matplotlib",
    "networkx",
    "numba",
    "numpy",
    "pandas",
    "scipy",
    "seaborn",
    "tqdm",
    "typing-extensions",
]

[project.optional-dependencies]
dev = [
    "openpyxl",
    "pytest",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-autoapi>=3.0.0",
    "sphinx-rtd-theme>=2.0.0",
]
notebooks = [
    "ipykernel",
    "jupyterlab",
]


[project.urls]
Homepage = "https://github.com/vahndi/probability"
Repository = "https://github.com/vahndi/probability"

[tool.setuptools.packages.find]
include = ["probability*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

